# FALLBACK for LINE /btc. Bitcoin Analysis (Grok Bot) stays the primary publisher (daily ~06:04–06:19 UTC+8).
# This only publishes when today's daily update is missing: last btc/latest.json (bot or fallback)
# is before 06:00 UTC+8, or older than 26 hours. Cron runs a few times a day so a miss is filled at most once.
name: fallback-btc
on:
  schedule:
    # Taipei 07:35, 12:35, 18:35 — after the daily bot window (~06:04–06:19), plus two later chances
    - cron: "35 23 * * *"   # 07:35 UTC+8
    - cron: "35 4 * * *"    # 12:35 UTC+8
    - cron: "35 10 * * *"   # 18:35 UTC+8
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (build + compare, no writes) or publish"
        type: choice
        options: [dry-run, publish]
        default: dry-run
      force:
        description: "ignore staleness"
        type: boolean
        default: false
      simulate_stale:
        description: "test: pretend btc/latest.json is 27h old (forces dry-run, no writes)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: fallback-btc
  cancel-in-progress: false
env:
  # Content in private macro-outlook-media; needs repo secret MEDIA_REPO_TOKEN.
  TZ: Asia/Taipei
  GH_TOKEN: ${{ secrets.MEDIA_REPO_TOKEN }}
  GH_CHARTS_TOKEN: ${{ secrets.MEDIA_REPO_TOKEN }}
  GHR_OVERRIDE: daniel414/macro-outlook-media
  BOT_MAX_AGE_MIN: "1560"     # 26h unified cap (bot or fallback)
  SELF_MAX_AGE_MIN: "1560"
  BTC_DUE: "06:00"            # Taipei; last publish before today's due => today's daily /btc missed
jobs:
  fallback:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts
            .github
      - id: check
        env:
          FORCE: ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '1' || '0' }}
          SIMULATE_AGE_MIN: ${{ (github.event_name == 'workflow_dispatch' && inputs.simulate_stale) && '1620' || '' }}
        run: python3 scripts/check_stale.py btc
      - if: steps.check.outputs.stale == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'dry-run' || inputs.simulate_stale))
        uses: ./.github/actions/setup-render
      - if: steps.check.outputs.stale == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'dry-run' || inputs.simulate_stale))
        working-directory: scripts/btc
        run: |
          MODE="${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'publish' }}"
          FORCE_ARG="${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '--force' || '' }}"
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.simulate_stale }}" = "true" ]; then MODE=dry-run; FORCE_ARG=--force; echo "SIMULATED STALE: dry-run, no writes"; fi
          python fallback_btc.py --mode "$MODE" $FORCE_ARG
      - if: github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run'
        uses: actions/upload-artifact@v4
        with:
          name: btc-dry-run
          path: |
            scripts/btc/out/fallback/
          retention-days: 3
