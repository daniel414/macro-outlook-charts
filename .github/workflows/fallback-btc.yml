# FALLBACK for LINE /btc. Bitcoin Analysis (Grok Bot) stays the primary publisher (hourly ~:05-:13 UTC+8).
# This only publishes when btc/latest.json is stale: bot publish >= 65 min old, or our own fallback publish >= 50 min old.
# Private repo: keep monthly Actions minutes under the free 2000. FRESH runs bill ~1 min each.
# Flat every-15-min (4/h) would be ~2880 min/mo; hybrid stays ~1800 + buffer for STALE/onchain.
name: fallback-btc
on:
  schedule:
    # Quiet hours Taipei 00–05 (UTC 16–21): every 15 min — overnight cron drops caused the 10/29 05:xx miss
    - cron: "7,22,37,52 16-21 * * *"
    # Active hours Taipei 06–23 (UTC 22–15): every 30 min at :22 and :52 (65-min threshold after bot :05–:13)
    - cron: "22,52 22-23 * * *"
    - cron: "22,52 0-15 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (build + compare, no writes) or publish"
        type: choice
        options: [dry-run, publish]
        default: dry-run
      force:
        description: "ignore staleness"
        type: boolean
        default: false
      simulate_stale:
        description: "test: pretend btc/latest.json is 120 min old (forces dry-run, no writes)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: fallback-btc
  cancel-in-progress: false
env:
  # Content in private macro-outlook-media; needs repo secret MEDIA_REPO_TOKEN.
  TZ: Asia/Taipei
  GH_TOKEN: ${{ secrets.MEDIA_REPO_TOKEN }}
  GH_CHARTS_TOKEN: ${{ secrets.MEDIA_REPO_TOKEN }}
  GHR_OVERRIDE: daniel414/macro-outlook-media
  BOT_MAX_AGE_MIN: "65"
  SELF_MAX_AGE_MIN: "50"
jobs:
  fallback:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts
            .github
      - id: check
        env:
          FORCE: ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '1' || '0' }}
          SIMULATE_AGE_MIN: ${{ (github.event_name == 'workflow_dispatch' && inputs.simulate_stale) && '120' || '' }}
        run: python3 scripts/check_stale.py btc
      - if: steps.check.outputs.stale == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'dry-run' || inputs.simulate_stale))
        uses: ./.github/actions/setup-render
      - if: steps.check.outputs.stale == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'dry-run' || inputs.simulate_stale))
        working-directory: scripts/btc
        run: |
          MODE="${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'publish' }}"
          FORCE_ARG="${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '--force' || '' }}"
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.simulate_stale }}" = "true" ]; then MODE=dry-run; FORCE_ARG=--force; echo "SIMULATED STALE: dry-run, no writes"; fi
          python fallback_btc.py --mode "$MODE" $FORCE_ARG
      - if: github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run'
        uses: actions/upload-artifact@v4
        with:
          name: btc-dry-run
          path: |
            scripts/btc/out/fallback/
          retention-days: 3
