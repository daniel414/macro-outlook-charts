# Ben Cowen new long-video watcher -> POSTs to the Grok Bot routine webhook (Threads Manager).
# Replaces the Grok Bot 15-min "Cowen 新片監視" routine. Free: GitHub-hosted runner + public YouTube pages/RSS.
name: cowen-watch
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "test mode: POST {test:true} for video_id (or latest), state untouched"
        type: boolean
        default: false
      video_id:
        description: "optional video id for test mode"
        type: string
        default: ""
permissions:
  contents: write
concurrency:
  group: cowen-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts/cowen
            state
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check for new videos
        env:
          COWEN_WEBHOOK_URL: ${{ secrets.COWEN_WEBHOOK_URL }}
          COWEN_WEBHOOK_KEY: ${{ secrets.COWEN_WEBHOOK_KEY }}
          TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.test && 'true' || 'false' }}
          VIDEO_ID: ${{ inputs.video_id }}
        run: python scripts/cowen/cowen_watch.py
      - name: Commit state
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.test) }}
        run: |
          git config user.name "cowen-watch[bot]"
          git config user.email "cowen-watch@users.noreply.github.com"
          git add state/cowen-seen.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "state unchanged"; exit 0; fi
          git commit -m "cowen-watch: update seen state [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase --quiet origin main && git push origin HEAD:main && exit 0
            sleep $((i*5))
          done
          echo "push failed"; exit 1
